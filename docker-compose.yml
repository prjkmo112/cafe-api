services:
  mysql:
    image: mysql:latest
    container_name: cafe-api-mysql
    environment:
      MYSQL_DATABASE: cafe
      MYSQL_USER: cafeuser
      MYSQL_PASSWORD: cafepw1234
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: cafe-api-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: